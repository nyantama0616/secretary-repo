- name: "Phase 1: LXC の初期設定"
  hosts: secretary
  vars:
    app_user: secretary

  tasks:
    - name: パッケージが最新である
      apt:
        update_cache: true
        upgrade: dist

    - name: 基本ツールがインストールされている
      apt:
        name:
          - curl
          - git
          - gnupg
          - sudo
        state: present

    - name: アプリ用ユーザーが存在する
      user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: true
        groups: sudo
        append: true

    - name: パスワードなし sudo が許可されている
      copy:
        dest: "/etc/sudoers.d/{{ app_user }}"
        content: "{{ app_user }} ALL=(ALL) NOPASSWD:ALL"
        mode: "0440"

    - name: SSH ディレクトリが存在する
      file:
        path: "/home/{{ app_user }}/.ssh"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0700"

    - name: 開発者の SSH 公開鍵が配置されている
      authorized_key:
        user: "{{ app_user }}"
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
        state: present
        exclusive: false

    - name: CI 用の SSH 公開鍵が配置されている
      authorized_key:
        user: "{{ app_user }}"
        key: "{{ lookup('file', playbook_dir + '/../ci_deploy_key.pub') }}"
        state: present
        exclusive: false
      when: lookup('fileglob', playbook_dir + '/../ci_deploy_key.pub') | length > 0
