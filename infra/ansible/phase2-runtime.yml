- name: "Phase 2: ランタイムのインストール"
  hosts: secretary
  vars:
    node_major: 24

  tasks:
    # Node.js
    - name: NodeSource GPG キーが登録されている
      shell: curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
      args:
        creates: /usr/share/keyrings/nodesource.gpg

    - name: NodeSource リポジトリが追加されている
      copy:
        dest: /etc/apt/sources.list.d/nodesource.list
        content: "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main"

    - name: Node.js {{ node_major }}.x がインストールされている
      apt:
        name: nodejs
        state: present
        update_cache: true

    - name: pnpm がインストールされている
      shell: corepack enable pnpm
      args:
        creates: /usr/local/bin/pnpm
      environment:
        COREPACK_ENABLE_AUTO_INSTALL: "1"

    # PostgreSQL
    - name: PostgreSQL APT リポジトリキーが登録されている
      shell: curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
      args:
        creates: /usr/share/keyrings/postgresql.gpg

    - name: PostgreSQL APT リポジトリが追加されている
      copy:
        dest: /etc/apt/sources.list.d/pgdg.list
        content: 'deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt {{ ansible_facts["distribution_release"] }}-pgdg main'

    - name: PostgreSQL 17 がインストールされている
      apt:
        name:
          - postgresql-17
          - python3-psycopg2
        state: present
        update_cache: true

    - name: PostgreSQL が起動している
      systemd:
        name: postgresql
        state: started
        enabled: true
